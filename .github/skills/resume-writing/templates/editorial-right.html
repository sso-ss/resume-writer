<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$name | Product Designer Resume</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { --accent: #466454; --accent-ink: #fff; margin: 0; background: #f7f7f7; color: #121212; font: 14px/1.6 Arial, Helvetica, sans-serif; }
    body:not([data-layout="editorial-html"]) { --accent: #2b4c5e; }
    body[data-layout="single-column"] { --accent: #1a1a1a; }
    body:not([data-layout="editorial-html"]) .page { font-family: Arial, sans-serif; color: #333; }
    .preview-nav { display: flex; align-items: center; min-height: 76px; padding: 18px 32px; background: #fff; border-bottom: 1px solid #e6e6e6; }
    .preview-brand { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 800; letter-spacing: -1px; }
    .preview-brand svg { width: 30px; height: 34px; padding: 7px; border-radius: 8px; background: #121212; color: white; }
    .preview-intro { max-width: 816px; margin: 32px auto 20px; }
    .preview-intro h2 { margin: 0 0 5px; color: #121212; font: 600 26px/1.2 Arial, Helvetica, sans-serif; letter-spacing: -.8px; text-transform: none; }
    .preview-intro p { margin: 0; color: #686868; font-size: 13px; }
    .toolbar { max-width: 816px; margin: 0 auto 24px; padding: 16px 18px; background: white; border: 1px solid #e6e6e6; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 12px; color: #121212; }
    .actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .layout-picker, .color-picker { display: flex; align-items: center; gap: 9px; font-weight: 600; }
    .layout-picker select { max-width: 100%; border: 1px solid #dedede; border-radius: 8px; background: #fff; color: #121212; padding: 10px 30px 10px 11px; font: 13px Arial, Helvetica, sans-serif; cursor: pointer; }
    .color-picker { margin-right: 7px; }
    .color-picker input { width: 36px; height: 36px; padding: 3px; border: 1px solid #dedede; border-radius: 8px; background: white; cursor: pointer; }
    .toolbar button { border: 1px solid #121212; border-radius: 30px; background: #121212; color: #fff; padding: 10px 17px; font: 600 12px Arial, Helvetica, sans-serif; cursor: pointer; white-space: nowrap; }
    .toolbar button:hover { background: #333; border-color: #333; }
    .toolbar #save-pdf { background: white; border-color: #dedede; color: #121212; }
    .toolbar #save-pdf:hover { background: #f2f2f2; }
    .toolbar button:disabled { opacity: .5; cursor: wait; }
    .toolbar :focus-visible { outline: 3px solid #658e1c; outline-offset: 3px; }
    .page { width: 816px; min-height: 1056px; font: 10pt/1.45 'DM Sans', Arial, sans-serif; color: #232924; background: #fff; margin: 0 auto 32px; padding: 46px 54px 40px; box-shadow: 0 5px 20px #00000005; }
    .eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin: 0 0 9px; }
    h1 { font: 800 39px/1.1 Manrope, Arial, sans-serif; letter-spacing: -1px; margin: 0; color: #1d2821; }
    body:not([data-layout="editorial-html"]) h1 { font: 700 29px/1.15 Arial, sans-serif; color: #1a1a1a; letter-spacing: 0; }
    .role { font-size: 17px; color: var(--accent); margin: 7px 0 13px; font-weight: 500; }
    body:not([data-layout="editorial-html"]) .eyebrow, body:not([data-layout="editorial-html"]) .role { display: none; }
    .summary-label { display: none; }
    .contact { display: flex; flex-wrap: wrap; gap: 3px 15px; font-size: 10px; color: #58605a; overflow-wrap: anywhere; }
    a { color: var(--accent); text-decoration: none; }
    .intro { font-size: 11.5px; line-height: 1.55; margin: 19px 0 23px; color: #454e47; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 177px; gap: 32px; }
    .section { margin: 0 0 19px; }
    h2 { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin: 0 0 11px; font-weight: 700; }
    h3 { font-size: 12.5px; line-height: 1.3; margin: 0 0 3px; font-weight: 700; }
    .org { font-size: 10.5px; font-weight: 500; margin: 0; }
    .meta { font-size: 9.5px; color: #747c76; margin: 1px 0 6px; }
    .job { margin-bottom: 16px; break-inside: avoid; }
    .job-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 12px; margin-bottom: 6px; }
    .job-header h3 { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    .job-header .meta { margin: 0 0 0 auto; overflow-wrap: anywhere; }
    ul { padding-left: 14px; margin: 0; }
    li { padding-left: 2px; margin: 0 0 4px; font-size: 10.2px; line-height: 1.4; }
    .project { margin-bottom: 11px; break-inside: avoid; }
    .project p { font-size: 10px; line-height: 1.4; margin: 2px 0; }
    .portfolio { color: var(--accent); overflow-wrap: anywhere; }
    .aside-section { margin-bottom: 20px; break-inside: avoid; }
    .aside-section h2 { margin-bottom: 9px; }
    .aside-section p { font-size: 10px; line-height: 1.45; margin: 0 0 8px; overflow-wrap: anywhere; }
    .label { font-weight: 700; display: block; color: #283c2e; margin-bottom: 2px; }
    body[data-layout="single-column"] .page { padding-left: 72px; padding-right: 72px; }
    body[data-layout="single-column"] header { text-align: center; }
    body[data-layout="single-column"] .contact { justify-content: center; }
    body[data-layout="single-column"] .layout { display: block; }
    body[data-layout="single-column"] .aside-section { margin-bottom: 14px; }
    body[data-layout="two-column-left"] .page { padding: 38px 34px; }
    body[data-layout="two-column-left"] .layout { grid-template-columns: 230px minmax(0, 1fr); gap: 0; }
    body[data-layout="two-column-left"] .sidebar { grid-column: 1; grid-row: 1; background: #f0efeb; padding: 10px 10px 10px 14px; }
    body[data-layout="two-column-left"] .main-column { grid-column: 2; grid-row: 1; padding: 10px 8px 10px 18px; }
    body[data-layout="two-column-left"] h1 { font-size: 31px; overflow-wrap: anywhere; }
    body[data-layout="two-column-left"] .contact { display: block; margin: 18px 0 24px; }
    body[data-layout="two-column-left"] .contact span { display: block; margin-bottom: 7px; }
    body[data-layout="two-column-right"] .layout { grid-template-columns: minmax(0, 1fr) 190px; }
    body[data-layout="two-column-right"] .sidebar .contact { display: block; margin-bottom: 22px; }
    body[data-layout="two-column-right"] .sidebar .contact span { display: block; margin-bottom: 6px; }
    body[data-layout="two-column-right-refined"] .page { padding: 38px; font-family: Arial, sans-serif; color: #262b2d; }
    body[data-layout="two-column-right-refined"] h1 { font: 700 29px/1.15 Arial, sans-serif; color: #1a1a1a; }
    body[data-layout="two-column-right-refined"] .contact { font-size: 12px; padding: 3px 0 9px; border-bottom: 1px solid #aaa; color: #667078; }
    body[data-layout="two-column-right-refined"] a, body[data-layout="two-column-right-refined"] h2 { color: var(--accent); }
    body[data-layout="two-column-right-refined"] .summary-label { display: block; margin: 11px 0 4px; font-size: 11px; letter-spacing: 0; }
    body[data-layout="two-column-right-refined"] .intro { margin: 0 0 16px; font-size: 12.5px; line-height: 1.4; }
    body[data-layout="two-column-right-refined"] .layout { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0; }
    body[data-layout="two-column-right-refined"] .main-column { padding: 4px 12px 8px 4px; }
    body[data-layout="two-column-right-refined"] .sidebar { padding: 10px 6px 8px 9px; }
    body[data-layout="two-column-right-refined"] .section { margin-bottom: 14px; }
    body[data-layout="two-column-right-refined"] .aside-section { margin-bottom: 15px; }
    body[data-layout="two-column-right-refined"] .job-header { display: block; }
    body[data-layout="two-column-right-refined"] .job-header .meta { display: block; margin: 2px 0 6px; }
    /* Document typography uses print points; app controls keep their own scale. */
    body[data-layout] .page { font-size: 10.5pt; }
    body[data-layout] .page p,
    body[data-layout] .page li,
    body[data-layout] .page .org { font-size: 10.5pt; line-height: 1.4; }
    body[data-layout] .page h2,
    body[data-layout] .page .eyebrow,
    body[data-layout] .page .contact,
    body[data-layout] .page .meta { font-size: 10pt; }
    body[data-layout] .page h3 { font-size: 12pt; }
    body[data-layout] .page .role { font-size: 12.75pt; }
    [contenteditable]:focus { outline: 2px solid #a5bba8; outline-offset: 7px; border-radius: 1px; }
    @media screen { .page { outline: 1px solid #e6e6e6; border-radius: 16px; } }
    @media (max-width: 850px) {
      .preview-intro { margin: 26px 20px 18px; }
      .toolbar { margin: 0 20px 24px; flex-wrap: wrap; }
      .preview-nav { padding: 16px 20px; }
      .page { width: 100%; min-height: 0; padding: 36px 30px; }
      .layout { grid-template-columns: minmax(0, 1fr) 160px; gap: 24px; }
      h1 { font-size: 35px; }
    }
    @media (max-width: 560px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .toolbar { align-items: stretch; flex-direction: column; padding: 16px; }
      .layout-picker { justify-content: space-between; }
      .actions { gap: 10px; }
      .color-picker { width: 100%; justify-content: space-between; margin: 0 0 4px; }
      .actions button { flex: 1; }
      .preview-brand { font-size: 18px; }
      body[data-layout="single-column"] .page { padding: 36px 30px; }
      body[data-layout="two-column-right-refined"] .page { padding: 36px 30px; }
      body[data-layout="two-column-right-refined"] .layout { grid-template-columns: 1fr; }
      body[data-layout="two-column-right-refined"] .main-column, body[data-layout="two-column-right-refined"] .sidebar { padding: 0; }
      body[data-layout="two-column-left"] .page { padding: 36px 30px; }
      body[data-layout="two-column-left"] .layout, body[data-layout="two-column-right"] .layout { display: flex; flex-direction: column; gap: 16px; }
      body[data-layout="two-column-left"] .sidebar, body[data-layout="two-column-right"] .sidebar { display: contents; }
      body[data-layout="two-column-left"] .sidebar header, body[data-layout="two-column-right"] .sidebar .contact { order: 0; }
      body[data-layout="two-column-left"] .main-column, body[data-layout="two-column-right"] .main-column { order: 1; }
      body[data-layout="two-column-left"] .sidebar .aside-section, body[data-layout="two-column-right"] .sidebar .aside-section { order: 2; }
      h1 { font-size: 32px; }
    }
    @page { size: Letter; margin: 0; }
    @media print {
      body { background: white; }
      .preview-nav, .preview-intro, .toolbar { display: none !important; }
      .page { margin: 0; box-shadow: none; width: 8.5in; min-height: 0; padding: .4in .56in .34in; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      body[data-layout="two-column-left"] .page { padding: .4in .35in; }
      body[data-layout="two-column-left"] .sidebar { margin: 0; padding: 10px 10px 10px 14px; background: #f0efeb; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      body[data-layout="two-column-left"] .main-column { padding: 10px 8px 10px 18px; }
      body[data-layout="editorial-html"] .layout { display: block; position: relative; }
      body[data-layout="editorial-html"] .main-column { width: calc(100% - 209px); }
      body[data-layout="editorial-html"] .sidebar { display: block; position: absolute; top: 0; right: 0; width: 177px; }
      body[data-layout="two-column-right-refined"] .page { padding: .4in; }
      .intro { margin: 13px 0 14px; }
      .section { margin-bottom: 12px; }
      h2 { margin-bottom: 8px; }
      h1, h2, .eyebrow { letter-spacing: 0; }
      .job { margin-bottom: 11px; }
      li { margin-bottom: 3px; }
      .project { margin-bottom: 7px; }
      [contenteditable]:focus { outline: none; }
    }
  </style>
</head>
<body data-layout="$layout">
  <div class="preview-nav" role="banner"><div class="preview-brand"><svg viewBox="0 0 17 21" fill="none" aria-hidden="true"><path d="M3 1.5h7l4 4v14H3zM10 1.5v4h4M5.5 10h6M5.5 13h6M5.5 16h4" stroke="currentColor" stroke-width="1.2"/></svg>Resume Preview</div></div>
  <div class="preview-intro"><h2>Edit your resume.</h2><p>Click any text to edit. Choose a layout, then download your resume.</p></div>
  <div class="toolbar"><label class="layout-picker" for="preview-layout">Template <select id="preview-layout"><option value="single-column">Single Column</option><option value="two-column-left">Left Sidebar</option><option value="two-column-right">Right Sidebar</option><option value="two-column-right-refined">Refined Right Sidebar</option><option value="editorial-html">Editorial</option></select></label><div class="actions"><label class="color-picker" for="accent-color">Accent <input id="accent-color" type="color" value="#466454" title="Resume accent color"></label><button type="button" id="save-pdf" title="Download PDF with selectable text">Save as PDF</button><button type="button" id="save-word" title="Download Word with your edits and selected layout">Save as Word</button></div></div>
  <main class="page" contenteditable="true" spellcheck="false" aria-label="Editable product designer resume">
    $page_content
  </main>
  <script>
    const page = document.querySelector('.page');
    const key = 'product-designer-resume-$storage_key';
    try {
      const saved = localStorage.getItem(key);
      if (saved) page.innerHTML = saved;
      const savedLayout = localStorage.getItem(key + '-layout');
      if (['single-column', 'two-column-left', 'two-column-right', 'two-column-right-refined', 'editorial-html'].includes(savedLayout)) document.body.dataset.layout = savedLayout;
    } catch (error) { /* local files may block storage */ }
    if (!page.querySelector('.summary-label')) {
      const label = document.createElement('h2');
      label.className = 'summary-label';
      label.textContent = 'Summary';
      page.querySelector('.intro')?.before(label);
    }
    for (const job of page.querySelectorAll('.job')) {
      if (job.querySelector('.job-header')) continue;
      const title = job.querySelector('h3');
      const company = job.querySelector('.org');
      const date = job.querySelector('.meta');
      if (!title) continue;
      const header = document.createElement('div');
      header.className = 'job-header';
      title.before(header);
      header.append(title);
      if (company) {
        if (company.textContent.trim()) {
          const label = document.createElement('span');
          label.className = 'org';
          label.append(...company.childNodes);
          title.append(' | ', label);
        }
        company.remove();
      }
      if (date) header.append(date);
    }
    page.addEventListener('input', () => { try { localStorage.setItem(key, page.innerHTML); } catch (error) { /* editing still works */ } });
    $word_export_script
  </script>
</body>
</html>
